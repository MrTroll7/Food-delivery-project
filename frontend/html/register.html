<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Военмех .ЕДА</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/cart.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>
<body>
  <header>
    <nav>
      <div class="footer-left">
        <a href="index.html" class="logo">
          <span>Военмех</span>.ЕДА
        </a>
        <div class="nav-links">
          <a href="catalog.html">Каталог</a>
        </div>
      </div>
      <div class="footer-right">
        <a href="checkout.html" class="cart-btn">
          Корзина
          <span id="cart-badge" class="badge">0</span>
        </a>
        <div class="profile-dropdown">
          <button class="profile-btn">Профиль</button>
          <div class="profile-dropdown-content"></div>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <form class="checkout-form" id="register-form">
      <h1><span>Регистрация</span></h1>

      <div id="form-error" class="form-error"></div>

      <div class="form-group" style="flex-direction: column; align-items: flex-start;">
        <label for="name">Ваше имя</label>
        <input type="text" id="name" required placeholder="Иван Иванов">
      </div>

      <div class="form-group" style="flex-direction: column; align-items: flex-start;">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="example@mail.ru">
      </div>

      <div class="form-group" style="flex-direction: column; align-items: flex-start;">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" placeholder="+7 (999) 000-00-00">
      </div>

      <div class="form-group" style="flex-direction: column; align-items: flex-start;">
        <label for="password">Пароль</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-full">Создать аккаунт</button>

      <p class="auth-link">
        Уже зарегистрированы? <a href="login.html">Войти</a>
      </p>
    </form>
  </main>

  <footer>
    <small>© 2026 Ресторан "Военмех .ЕДА". Все права защищены.</small>
    <a href="contacts.html">Контакты</a>
  </footer>
</body>
</html>
