<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ресторан "Военмех .ЕДА"</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/cart.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>
<body>
<header>
  <nav>
    <div class="footer-left">
      <a href="index.html" class="logo">
        <span>Военмех</span>.ЕДА
      </a>
      <div class="nav-links">
        <a href="catalog.html">Каталог</a>
      </div>
    </div>
    <div class="footer-right">
      <a href="checkout.html" class="cart-btn">
        Корзина
        <span id="cart-badge" class="badge">0</span>
      </a>
      <div class="profile-dropdown">
        <button class="profile-btn">Профиль</button>
        <div class="profile-dropdown-content">
          <!-- Заполняется автоматически через auth.js -->
        </div>
      </div>
    </div>
  </nav>
</header>

  <main class="contacts">
    <h1>Контакты</h1>

    <div class="contact-item">
      <h3>Адрес</h3>
      <p>ул. Кулинарная, д. 15, корпус А, Москва</p>
    </div>

    <div class="contact-item">
      <h3>Телефон</h3>
      <p>+7 (495) 123-45-67</p>
    </div>

    <div class="contact-item">
      <h3>Время работы</h3>
      <p>Пн‑Пт: 11:00 – 22:00</br>Сб-Вс: 12:00 – 23:00</p>
    </div>

    <div class="contact-item">
      <h3>Карта</h3>
      <div style="border: 1px solid var(--border-color); border-radius: 6px; height: 200px; background: #f0f0f0; margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; color: #666;">
        Интерактивный блок карты
      </div>
    </div>

    <div class="form-feedback">
      <h2>Форма обратной связи</h2>

      <form>
        <div class="form-group">
          <label>Имя <input type="text" required></label>
        </div>
        <div class="form-group">
          <label>Email <input type="email" required></label>
        </div>
        <div class="form-group">
          <label>Сообщение <textarea rows="3" required></textarea></label>
        </div>

        <button type="submit">Отправить</button>
      </form>
    </div>
  </main>

  <footer>
    <small>© 2026 Ресторан "Военмех .ЕДА". Все права защищены.</small>
    <a href="contacts.html">Контакты</a>
  </footer>
</body>
</html>
