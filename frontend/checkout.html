<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ресторан "Военмех .ЕДА"</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/cart.js" defer></script>
  <script src="/js/checkout.js" defer></script>
  <script src="/js/auth.js" defer></script>
</head>
<body>
<header>
  <nav>
    <div class="footer-left">
      <a href="index.html" class="logo">
        <span>Военмех</span>.ЕДА
      </a>
      <div class="nav-links">
        <a href="catalog.html">Каталог</a>
      </div>
    </div>
    <div class="footer-right">
      <a href="checkout.html" class="cart-btn">
        Корзина
        <span id="cart-badge" class="badge">0</span>
      </a>
      <div class="profile-dropdown">
        <button class="profile-btn">Профиль</button>
        <div class="profile-dropdown-content">
          <!-- Заполняется автоматически через auth.js -->
        </div>
      </div>
    </div>
  </nav>
</header>

  <main>
    <h1>Корзина и оформление заказа</h1>

    <section class="checkout-form">
      <h2>Состав заказа</h2>
      <div class="cart-items">
        <p>Загрузка...</p>
      </div>
      <div class="checkout-summary">
        <p>Подытог: Загрузка ₽</p>
        <p class="total">Итого: Загрузка ₽</p>
      </div>
    </section>

    <form id="order-form" class="checkout-form">
      <h2>Доставка</h2>
      <div class="form-group">
        <label>
        Адрес доставки 
      </label>
      <textarea  id="address-input" placeholder="ул. Примерная, д. 10" required></textarea>
      </div>
      <div class="form-group">
        <button type="submit">Оформить заказ</button>
      </div>
    </form>
  </main>

  <footer>
    <small>© 2026 Ресторан "Военмех .ЕДА". Все права защищены.</small>
    <a href="contacts.html">Контакты</a>
  </footer>
</body>
</html>
